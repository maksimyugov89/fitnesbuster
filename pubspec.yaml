name: fitnesbuster
description: Your personal AI fitness trainer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.3.0

  # Dependency Injection
  get_it: ^9.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # Network
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.0

  # UI & Animations
  shimmer: ^3.0.0
  table_calendar: ^3.0.9
  # Camera & Image
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Health & Fitness
  health: ^13.3.1
  permission_handler: ^12.0.3

  # Charts & Visualization
  # Utils
  intl: ^0.20.2
  uuid: ^4.3.3
  logger: ^2.1.0
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.2

  # Notifications
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0

  # Firebase
  google_sign_in: ^6.2.1
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_analytics: ^12.4.2
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.2

  # Food & Nutrition
  openfoodfacts: ^3.30.2
  mobile_scanner: ^5.2.3
  flutter_tts: ^3.8.5

  # 3D model viewer (GLB/GLTF via WebView)
  model_viewer_plus: ^1.10.0

  # Screen / Display
  wakelock_plus: ^1.2.8

  # AI
  http: ^1.2.1
  url_launcher: ^6.3.2

  # Import / file picking
  file_picker: ^8.1.6

  # Геолокация (определение города пользователя для подбора продуктов питания)
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  freezed: ^2.5.0
  mockito: ^5.4.4
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icons/icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/data/
    - assets/anatomy/
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
