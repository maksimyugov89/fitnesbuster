name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FLUTTER_VERSION: '3.38.5'
  # Placeholder so the GitHub Actions VS Code extension recognizes ${{ env.FLUTTER_ROOT }}
  # as a known context — subosito/flutter-action overwrites this with the real SDK path
  # at runtime (via $GITHUB_ENV) before the Cache pub dependencies step reads it.
  FLUTTER_ROOT: ''

jobs:
  flutter:
    name: Flutter — analyze, format, test, coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}/.pub-cache
            pubspec.lock
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/ test/ integration_test/

      - name: Test (unit, widget, golden, test/integration)
        run: flutter test --coverage --reporter=expanded

      - name: Strip generated code from coverage
        run: |
          sudo apt-get update -y && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' '**/*.freezed.dart' '**/*.mocks.dart' \
            -o coverage/lcov.info --ignore-errors unused
          echo '## Test coverage summary' >> "$GITHUB_STEP_SUMMARY"
          lcov --summary coverage/lcov.info 2>&1 | tail -n +2 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: flutter
          name: flutter-tests
          disable_search: true
          fail_ci_if_error: true

      - name: Report coverage in PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: zgosalvez/github-actions-report-lcov@v7.1.0
        with:
          coverage-files: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Notify Telegram on failure
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: 'CI упал на master'
          message: 'Job: Flutter — analyze, format, test, coverage'

  functions:
    name: Cloud Functions — build, unit, emulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - name: Unit/spec tests (38)
        run: npm test

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.22.0

      - name: Callable integration tests (6 — Auth/Firestore/Functions emulators)
        run: npm run test:emulator:exec

      - name: Notify Telegram on failure
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: 'CI упал на master'
          message: 'Job: Cloud Functions — build, unit, emulator'
