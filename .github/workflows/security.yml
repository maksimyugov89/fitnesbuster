name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # каждый понедельник в 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reusable workflow OSV всегда загружает промежуточный SARIF artifact, даже
  # когда upload-sarif=false. При исчерпанной Actions storage quota это делало
  # успешный scan красным. Прямой scanner action сохраняет строгий exit code при
  # найденных CVE, но не зависит от GitHub artifact storage.
  osv-scan:
    name: OSV vulnerability scan (pub + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan pub and npm lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@a82132c0bd6c7261ffcb78e754c46c70ab57ad9a # v2.3.8
        with:
          scan-args: |-
            --lockfile=./pubspec.lock
            --lockfile=./functions/package-lock.json

  notify-on-vulnerabilities:
    name: Notify Telegram
    needs: [osv-scan]
    if: always() && needs.osv-scan.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Notify Telegram
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: 'Найдены уязвимости в зависимостях'
          message: 'OSV-Scanner нашёл известные CVE в pubspec.lock или functions/package-lock.json. Подробности — в логе job "OSV vulnerability scan" в Actions.'
