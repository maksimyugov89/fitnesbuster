name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # каждый понедельник в 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SARIF-загрузка в Security → Code scanning и actions/dependency-review-action
  # требуют GitHub Advanced Security, которая для приватных репозиториев платная.
  # Поэтому upload-sarif выключен и job dependency-review убран — OSV-Scanner
  # сам по себе уже проверяет pubspec.lock и functions/package-lock.json на
  # известные CVE и валит job при находках (см. вывод в логе/summary run'а).
  osv-scan:
    name: OSV vulnerability scan (pub + npm)
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=./pubspec.lock
        --lockfile=./functions/package-lock.json
      upload-sarif: false
      fail-on-vuln: true

  notify-on-vulnerabilities:
    name: Notify Telegram
    needs: [osv-scan]
    if: always() && needs.osv-scan.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Notify Telegram
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: 'Найдены уязвимости в зависимостях'
          message: 'OSV-Scanner нашёл известные CVE в pubspec.lock или functions/package-lock.json. Подробности — в логе job "OSV vulnerability scan" в Actions.'
