name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # каждый понедельник в 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV vulnerability scan (pub + npm)
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=./pubspec.lock
        --lockfile=./functions/package-lock.json
      upload-sarif: true
      fail-on-vuln: true

  dependency-review:
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  notify-on-vulnerabilities:
    name: Notify Telegram
    needs: [osv-scan]
    if: always() && needs.osv-scan.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Telegram
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: 'Найдены уязвимости в зависимостях'
          message: 'OSV-Scanner нашёл известные CVE в pubspec.lock или functions/package-lock.json. Подробности — во вкладке Security → Code scanning.'
