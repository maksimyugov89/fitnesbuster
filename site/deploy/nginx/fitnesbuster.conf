# fitnesbuster.ru — статический сайт приложения FitnesBuster.
# Живёт на том же nginx, что и storyhero.ru: отдельные server-блоки,
# конфиг StoryHero не меняется. Контент отдаёт контейнер fitnesbuster-web.

server {
    listen 80;
    listen [::]:80;
    server_name fitnesbuster.ru www.fitnesbuster.ru;

    # ACME-челлендж Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fitnesbuster.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fitnesbuster.ru;

    ssl_certificate     /etc/letsencrypt/live/fitnesbuster.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitnesbuster.ru/privkey.pem;

    return 301 https://fitnesbuster.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fitnesbuster.ru;

    ssl_certificate     /etc/letsencrypt/live/fitnesbuster.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitnesbuster.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:FBSSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/fitnesbuster-headers.inc;

    # Сжатие
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/manifest+json application/ld+json image/svg+xml;

    # 404 — своя страница
    error_page 404 /404.html;

    # Страницы и прочее: без кэша, чтобы правки сайта доезжали сразу.
    # (nginx не наследует add_header в location со своими add_header,
    #  поэтому заголовки безопасности подключаются тут повторно.)
    location / {
        include /etc/nginx/conf.d/fitnesbuster-headers.inc;

        proxy_pass http://fitnesbuster-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache" always;
    }

    # Скачивание подписанной сборки: свой MIME-тип и имя файла
    location = /download/fitnesbuster-1.0.0.apk {
        include /etc/nginx/conf.d/fitnesbuster-headers.inc;

        proxy_pass http://fitnesbuster-web:80;
        proxy_set_header Host $host;
        proxy_hide_header Content-Disposition;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="fitnesbuster-1.0.0.apk"' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
    }

    # Стили и скрипты: имя файла не версионируется, а содержимое меняется
    # в каждом релизе — браузер обязан перепроверять их (ETag даёт дешёвый 304).
    location ~* \.(?:css|js)$ {
        include /etc/nginx/conf.d/fitnesbuster-headers.inc;

        proxy_pass http://fitnesbuster-web:80;
        proxy_set_header Host $host;
        proxy_ignore_headers Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # Картинки, шрифты, иконки: файлы стабильные — можно кэшировать надолго
    location ~* \.(?:woff2|png|jpe?g|webp|ico|svg)$ {
        include /etc/nginx/conf.d/fitnesbuster-headers.inc;

        proxy_pass http://fitnesbuster-web:80;
        proxy_set_header Host $host;
        proxy_ignore_headers Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
